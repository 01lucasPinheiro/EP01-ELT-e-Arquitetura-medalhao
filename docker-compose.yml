services:
  mongo:
    image: mongo:7
    container_name: pokedex_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pokedex_net

  postgres:
    image: postgres:16-alpine
    container_name: pokedex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokedex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - pokedex_net

volumes:
  mongo_data:
  pg_data:

networks:
  pokedex_net:
    driver: bridge
